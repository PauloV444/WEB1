<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Força Kira</title>
</head>

<body>

    <h1>Contato - Força Kira</h1>

    <h2>1. Formulário de Contato</h2>

    <form>

        <label>Nome:</label>
        <input type="text" name="nome">

        <br><br>

        <label>E-mail:</label>
        <input type="email" name="email">

        <br><br>

        <label>Mensagem:</label>
        <br>
        <textarea name="mensagem" rows="5" cols="40"></textarea>

        <br><br>

        <input type="submit" value="Enviar">

    </form>

    <hr>

    <h2>2. Formulário de Cadastro</h2>

    <form>

        <label>Nome completo:</label>
        <input type="text" name="nome">

        <br><br>

        <label>E-mail:</label>
        <input type="email" name="email">

        <br><br>

        <label>Senha:</label>
        <input type="password" name="senha">

        <br><br>

        <label>Data de nascimento:</label>
        <input type="date" name="data">

        <br><br>

        <input type="submit" value="Cadastrar">

    </form>

    <hr>

    <h2>3. Formulário de Pedido</h2>

    <form>

        <label>Nome:</label>
        <input type="text" name="nome">

        <br><br>

        <label>Produto:</label>

        <select name="produto">

            <option>Death Note</option>
            <option>Skynet Autoconsciente</option>
            <option>Batmóvel</option>
            <option>Caça F-35 Israelense</option>
            <option>Composto V</option>

        </select>

        <br><br>

        <label>Quantidade:</label>
        <input type="number" name="quantidade" min="1">

        <br><br>

        <label>Observações:</label>
        <br>

        <textarea name="observacao" rows="4" cols="40"></textarea>

        <br><br>

        <input type="submit" value="Enviar Pedido">

    </form>

    <hr>

    <h2>4. Formulário de Avaliação</h2>

    <form>

        <label>Nome:</label>
        <input type="text" name="nome">

        <br><br>

        <label>Nota:</label>

        <select name="nota">

            <option>5 - Excelente</option>
            <option>4 - Muito bom</option>
            <option>3 - Bom</option>
            <option>2 - Regular</option>
            <option>1 - Ruim</option>

        </select>

        <br><br>

        <label>Comentário:</label>
        <br>

        <textarea name="comentario" rows="5" cols="40"></textarea>

        <br><br>

        <input type="submit" value="Enviar Avaliação">

    </form>

    <hr>

    <a href="index.html">Voltar para o início</a>

</body>

</html>
